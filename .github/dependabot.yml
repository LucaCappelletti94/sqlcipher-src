---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # CodeQL refuses to run when its init and analyze steps differ, so they move in one pull request.
    groups:
      codeql-action:
        patterns:
          - github/codeql-action*
  - package-ecosystem: cargo
    directory: /interop/native
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: cargo
    directory: /interop/web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
