---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
  schedule:
    # Re-proves the generated sources against the pinned releases and the build on current runners.
    - cron: "43 6 * * 2"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.81"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo test --all-targets
      - run: cargo test --doc

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --manifest-path interop/native/Cargo.toml --check
      - run: cargo fmt --manifest-path interop/web/Cargo.toml --check
      - run: cargo clippy --manifest-path interop/native/Cargo.toml --all-targets -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  scripts:
    name: Scripts and workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck -x upgrade.sh bump.sh interop/run.sh suite/run.sh tools/releases.sh
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  regenerate:
    name: Generated sources match the signed releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get install -y --no-install-recommends tcl
      - run: ./upgrade.sh
      - run: git diff --exit-code

  interop:
    name: Native and Wasm SQLCipher open each other's files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: wasm-pack
      - run: ./interop/run.sh
        env:
          WASM_BINDGEN_TEST_TIMEOUT: "300"
      # A file missing from the package include list only shows up when building from the package.
      - name: Interop against the packaged crate
        run: |
          set -eu
          cargo package --quiet
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          SQLCIPHER_DIR="$PWD/target/package/sqlcipher-src-$version/sqlcipher" ./interop/run.sh
        env:
          WASM_BINDGEN_TEST_TIMEOUT: "300"
      - run: cargo clippy --manifest-path interop/web/Cargo.toml --target wasm32-unknown-unknown --all-targets -- -D warnings
        env:
          SQLITE_WASM_RS_SOURCE_DIR: ${{ github.workspace }}/sqlcipher

  browsers:
    name: Wasm SQLCipher runs in Chrome and Firefox
    runs-on: ubuntu-latest
    env:
      SQLITE_WASM_RS_SOURCE_DIR: ${{ github.workspace }}/sqlcipher
      WASM_BINDGEN_USE_BROWSER: "1"
      WASM_BINDGEN_TEST_TIMEOUT: "300"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: wasm-pack
      # These avoid Node's fs module, and sahpool needs a browser worker for OPFS.
      - name: Chrome
        working-directory: interop/web
        run: wasm-pack test --headless --chrome --release --test encryption --test broken_crypto --test broken_crypto_plain --test sahpool --test bindings
      - name: Firefox
        working-directory: interop/web
        run: wasm-pack test --headless --firefox --release --test encryption --test broken_crypto --test broken_crypto_plain --test sahpool --test bindings

  sqlcipher-suite:
    name: SQLCipher's own tests pass on the shipped sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get install -y --no-install-recommends tcl-dev
      # Cargo resolves the sqlite-wasm-rs revision whose wrapper the testfixture builds.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - run: ./suite/run.sh

  sanitizers:
    name: SQLCipher's own tests are clean under ASAN and UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get install -y --no-install-recommends tcl-dev
      # Cargo resolves the sqlite-wasm-rs revision whose wrapper the testfixture builds.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - run: ./suite/run.sh
        env:
          SANITIZE: "1"

  interop-msrv:
    name: Interop builds on its declared Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          set -euo pipefail
          floor() { cargo metadata --no-deps --format-version 1 --manifest-path "interop/$1/Cargo.toml" | jq -r '.packages[0].rust_version'; }
          native=$(floor native)
          web=$(floor web)
          rustup toolchain install "$native" --profile minimal
          rustup toolchain install "$web" --profile minimal --target wasm32-unknown-unknown
          cargo "+$native" check --manifest-path interop/native/Cargo.toml --all-targets
          SQLITE_WASM_RS_SOURCE_DIR="$PWD/sqlcipher" cargo "+$web" check --manifest-path interop/web/Cargo.toml --target wasm32-unknown-unknown --all-targets

  rusqlite-native:
    name: rusqlite's SQLCipher tests pass on these sources natively
    runs-on: ubuntu-latest
    env:
      # Moved by hand, since Dependabot cannot follow a git revision.
      RUSQLITE_REV: b6476751216cb8569a3f747611f37a394a8de4e3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - name: Build libsqlite3-sys from this amalgamation and run rusqlite's SQLCipher tests
        run: |
          set -euo pipefail
          rusqlite="$RUNNER_TEMP/rusqlite"
          git init -q "$rusqlite"
          git -C "$rusqlite" fetch -q --depth 1 https://github.com/rusqlite/rusqlite.git "$RUSQLITE_REV"
          git -C "$rusqlite" checkout -q FETCH_HEAD
          cp sqlcipher/sqlcipher.c "$rusqlite/libsqlite3-sys/sqlcipher/sqlite3.c"
          cp sqlcipher/sqlite3.h sqlcipher/sqlite3ext.h "$rusqlite/libsqlite3-sys/sqlcipher/"
          cd "$rusqlite"
          cargo test --features "backup blob chrono functions limits load_extension serde_json trace vtab bundled-sqlcipher-vendored-openssl"
