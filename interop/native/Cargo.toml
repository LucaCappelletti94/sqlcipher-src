[package]
name = "interop-native"
version = "0.0.0"
edition = "2021"
# rusqlite 0.41 needs 1.89.
rust-version = "1.89"
publish = false
description = "Writes and reads SQLCipher files with rusqlite's bundled SQLCipher"

[dependencies]
rusqlite = { version = "0.41", features = ["bundled-sqlcipher"] }

# The crate's table, minus unsafe_code (FFI) and missing_docs and cargo (never published).
[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"

# Standalone, so the root crate never adopts it as a member.
[workspace]
