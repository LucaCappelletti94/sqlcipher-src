[package]
name = "interop-web"
version = "0.0.0"
edition = "2021"
# rusqlite master needs 1.88.
rust-version = "1.88"
publish = false
description = "Runs SQLCipher built from this crate inside sqlite-wasm-rs under Node.js"

[dependencies]
sqlcipher-src = { path = "../.." }
sqlite-wasm-rs = { version = "0.6", features = ["wasm-bindgen"] }
wasm-bindgen = "0.2"

[dev-dependencies]
js-sys = "0.3"
# Released 0.40.2 pins sqlite-wasm-rs 0.5, which has no SQLITE_WASM_RS_SOURCE_DIR.
rusqlite = { git = "https://github.com/rusqlite/rusqlite", rev = "b6476751216cb8569a3f747611f37a394a8de4e3" }
wasm-bindgen-test = "0.3"
sqlite-wasm-vfs = { version = "0.3", features = ["sahpool"] }

# The crate's table, minus unsafe_code (FFI) and missing_docs and cargo (never published).
[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"

# Standalone, so the root crate never adopts it as a member.
[workspace]
